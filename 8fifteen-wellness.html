<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>8fifteen Wellness — Smart Inventory &amp; Sales</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#1E2E26; --cream:#F6F1E6; --paper:#FCFAF4; --line:#E4DCC9;
  --muted:#7C7363; --ochre:#BD8A35; --ochre-dark:#95691F; --rose:#B5717A;
  --rose-dark:#93545D; --green:#2F4F3E; --green-dark:#1E2E26; --danger:#B6533A;
  --danger-bg:#F4DFDA; --ok-bg:#E4EDE3; --low-bg:#F7E8CF;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--cream);color:var(--ink);}
.mono{font-family:'IBM Plex Mono',monospace;}
.display{font-family:'Fraunces',serif;}
button,input,select{font-family:inherit;}
#app{display:flex;height:100vh;overflow:hidden;}

/* Sidebar */
.sidebar{width:222px;flex-shrink:0;background:var(--green-dark);color:var(--cream);padding:22px 16px;display:flex;flex-direction:column;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.brand-name{font-size:18px;font-weight:600;line-height:1.1;}
.brand-tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#B9C4BA;margin:2px 0 24px 32px;}
.nav{display:flex;flex-direction:column;gap:3px;}
.nav-group-label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#7E8C81;margin:14px 4px 5px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13.5px;color:#D9DFD9;cursor:pointer;background:transparent;border:none;text-align:left;width:100%;}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav-item.active{background:var(--ochre);color:#1E2E26;font-weight:600;}
.nav-item svg{flex-shrink:0;}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);font-size:10.5px;color:#92A096;line-height:1.6;}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--paper);position:relative;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 26px;border-bottom:1px solid var(--line);}
.topbar h1{font-size:21px;margin:0;font-weight:500;}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.role-toggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:12px;}
.role-toggle button{padding:7px 14px;border:none;background:var(--paper);color:var(--muted);cursor:pointer;font-weight:500;}
.role-toggle button.active{background:var(--ink);color:#fff;}
.content{padding:22px 26px;overflow-y:auto;flex:1;}

/* Stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;}
.stat-top{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.stat-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.stat-value{font-family:'Fraunces',serif;font-size:23px;font-weight:500;}
.stat-sub{font-size:11.5px;color:var(--muted);margin-top:3px;}

.panel{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:16px;}
.panel-head{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.panel-head h3{margin:0;font-size:14.5px;font-weight:600;}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}

table{width:100%;border-collapse:collapse;font-size:12.8px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 16px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:9px 16px;border-bottom:1px solid #F0EBDC;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.empty-row td{text-align:center;color:var(--muted);padding:22px;white-space:normal;}
.table-wrap{overflow-x:auto;}

.badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px;display:inline-block;}
.badge-ok{background:var(--ok-bg);color:var(--green);}
.badge-low{background:var(--low-bg);color:var(--ochre-dark);}
.badge-out{background:var(--danger-bg);color:var(--danger);}
.badge-pay{background:#EEE8F2;color:#6A4E8C;}

.toolbar{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap;}
.search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 12px;flex:1;min-width:160px;max-width:300px;}
.search-box input{border:none;outline:none;font-size:13px;flex:1;background:transparent;}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.3px;cursor:pointer;color:var(--muted);}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.btn{font-size:12.8px;font-weight:600;padding:8px 15px;border-radius:8px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn-primary{background:var(--ochre);color:#fff;}
.btn-primary:hover{background:var(--ochre-dark);}
.btn-primary:disabled{background:#D9D2C0;cursor:not-allowed;}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn-ghost:hover{border-color:var(--ink);}
.btn-danger{background:transparent;border:1px solid var(--danger-bg);color:var(--danger);}
.btn-sm{padding:5px 10px;font-size:11.5px;border-radius:6px;}
.icon-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
.icon-btn:hover{border-color:var(--ink);}

/* POS */
.pos-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start;}
.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.product-tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;}
.product-tile:hover{border-color:var(--ochre);}
.product-tile[data-disabled="true"]{opacity:.42;cursor:not-allowed;}
.product-tile .cat{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
.product-tile .name{font-size:12.8px;font-weight:600;margin:4px 0 6px;line-height:1.3;}
.product-tile .price{font-size:12px;color:var(--green);}
.cart-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:0;}
.cart-line{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F0EBDC;gap:8px;}
.cart-line .name{font-size:12.3px;font-weight:500;}
.cart-line .price{font-size:11px;color:var(--muted);}
.qty-ctrl{display:flex;align-items:center;gap:6px;}
.qty-ctrl button{width:20px;height:20px;border-radius:5px;border:1px solid var(--line);background:var(--cream);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cart-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:11px;margin-top:6px;border-top:1px solid var(--line);}
.cart-total .label{font-size:12.3px;color:var(--muted);}
.cart-total .value{font-family:'Fraunces',serif;font-size:21px;}
.empty-cart{font-size:12.3px;color:var(--muted);text-align:center;padding:22px 0;}
.pay-row{display:flex;gap:6px;margin:12px 0;}
.pay-row .chip{flex:1;text-align:center;}

/* KPI / Accounting */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
.pl-block{padding:18px;}
.pl-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13.3px;border-bottom:1px dashed var(--line);}
.pl-row.total{border-bottom:none;border-top:2px solid var(--ink);margin-top:4px;padding-top:12px;font-weight:600;}
.pl-row .neg{color:var(--danger);}
.pl-row.sub .label{color:var(--muted);padding-left:14px;}

.bar-row{display:flex;align-items:center;gap:10px;padding:9px 0;}
.bar-row .bname{font-size:12.3px;width:120px;flex-shrink:0;}
.bar-track{flex:1;height:9px;background:#F0EBDC;border-radius:999px;overflow:hidden;}
.bar-fill{height:100%;border-radius:999px;background:var(--ochre);}
.bar-val{font-size:11.5px;width:90px;text-align:right;flex-shrink:0;color:var(--muted);}

.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
.cat-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;}
.cat-card h4{margin:0 0 10px;font-size:14.5px;display:flex;align-items:center;justify-content:space-between;}
.cat-card .row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:var(--muted);}
.cat-card .row b{color:var(--ink);font-weight:600;}
.cat-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}

.role-pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;}
.role-pill.admin{background:var(--ok-bg);color:var(--green);}
.role-pill.staff{background:#EFE4E6;color:var(--rose-dark);}

.toast{position:absolute;bottom:20px;right:20px;background:var(--green-dark);color:#fff;padding:11px 18px;border-radius:9px;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:50;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(30,46,38,.45);display:flex;align-items:center;justify-content:center;z-index:100;}
.modal{background:#fff;border-radius:14px;width:420px;max-width:92vw;max-height:88vh;overflow-y:auto;}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{margin:0;font-size:15.5px;}
.modal-body{padding:18px 20px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px;}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.3px;background:var(--paper);}
.field input:focus,.field select:focus{outline:2px solid var(--ochre);outline-offset:0;border-color:var(--ochre);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
.margin-preview{background:var(--cream);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--muted);margin-top:-2px;margin-bottom:13px;display:flex;justify-content:space-between;}
.margin-preview b{color:var(--green);font-family:'IBM Plex Mono',monospace;}

.access-note{padding:60px 20px;text-align:center;color:var(--muted);font-size:13.5px;}

@media (max-width: 880px){
  .sidebar{display:none;}
  .stat-grid,.kpi-grid,.cat-grid{grid-template-columns:repeat(2,1fr);}
  .two-col,.pos-grid,.product-grid,.field-row{grid-template-columns:1fr;}
}
</style>
</head>

function dStr(daysAgo){ const d=new Date(); d.setDate(d.getDate()-daysAgo); return d.toISOString().slice(0,10); }
const TODAY = dStr(0), YDAY = dStr(1);

function mkSale(receipt,date,time,items,payment,staff){
  const lines = items.map(it=>{
    const p = products.find(x=>x.id===it.id);
    return {productId:p.id,name:p.name,category:p.category,qty:it.qty,price:p.price,cost:p.cost};

  const total = lines.reduce((s,l)=>s+l.price*l.qty,0);
  const costTotal = lines.reduce((s,l)=>s+l.cost*l.qty,0);
  return {id:"s_"+receipt,receipt,date,time,items:lines,payment,staff,total,cost:costTotal,profit:total-costTotal};
}

/* ---------- UTIL ---------- */
function naira(n){ return "₦"+Math.round(n||0).toLocaleString("en-NG"); }
function pct(n){ return (isFinite(n)?n:0).toFixed(1)+"%"; }
function uid(p){ return p+"_"+Math.random().toString(36).slice(2,8); }
function fmtDate(d){ const dt=new Date(d+"T00:00:00"); return dt.toLocaleDateString("en-GB",{day:"2-digit",month:"short"}); }
function showToast(msg){ S.toast=msg; render(); setTimeout(()=>{ S.toast=null; renderToastOnly(); },2600); }

/* ---------- AGGREGATES ---------- */
function lowStockItems(){ return products.filter(p=>p.stock<=p.low); }
function totalStockUnits(){ return products.reduce((s,p)=>s+p.stock,0); }
function inventoryCostValue(){ return products.reduce((s,p)=>s+p.stock*p.cost,0); }
function inventoryRetailValue(){ return products.reduce((s,p)=>s+p.stock*p.price,0); }
function salesOn(date){ return sales.filter(s=>s.date===date); }
function sumSales(list){
  return list.reduce((acc,s)=>({revenue:acc.revenue+s.total,cost:acc.cost+s.cost,profit:acc.profit+s.profit,items:acc.items+s.items.reduce((a,l)=>a+l.qty,0)}),{revenue:0,cost:0,profit:0,items:0});
}
function totalExpenses(list){ return (list||expenses).reduce((s,e)=>s+e.amount,0); }
function categoryStats(){
  return CATEGORIES.map(cat=>{
    const prods = products.filter(p=>p.category===cat);
    const stockUnits = prods.reduce((s,p)=>s+p.stock,0);
    const stockCost = prods.reduce((s,p)=>s+p.stock*p.cost,0);
    const stockRetail = prods.reduce((s,p)=>s+p.stock*p.price,0);
    let unitsSold=0, revenue=0, cost=0;
    sales.forEach(s=>s.items.forEach(l=>{ if(l.category===cat){ unitsSold+=l.qty; revenue+=l.price*l.qty; cost+=l.cost*l.qty; } }));
    return {cat,productCount:prods.length,stockUnits,stockCost,stockRetail,unitsSold,revenue,cost,profit:revenue-cost,margin: revenue? (revenue-cost)/revenue*100:0};
  });
}
function topProducts(limit){
  const map={};
  sales.forEach(s=>s.items.forEach(l=>{
    if(!map[l.productId]) map[l.productId]={name:l.name,qty:0,revenue:0};
    map[l.productId].qty+=l.qty; map[l.productId].revenue+=l.price*l.qty;
  }));
  return Object.values(map).sort((a,b)=>b.revenue-a.revenue).slice(0,limit||5);
}
function filteredHistory(){
  return sales.filter(s=>{
    if(S.histFrom && s.date<S.histFrom) return false;
    if(S.histTo && s.date>S.histTo) return false;
    if(S.histCategory!=="All" && !s.items.some(l=>l.category===S.histCategory)) return false;
    if(S.histSearch && !s.receipt.toLowerCase().includes(S.histSearch.toLowerCase())) return false;
    return true;
  }).sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));
}

      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Top selling products</h3></div>
      <div class="table-wrap"><table><thead><tr><th>Product</th><th>Units sold</th><th>Revenue</th></tr></thead><tbody>
        ${topProducts(6).map(t=>`<tr><td>${t.name}</td><td class="mono">${t.qty}</td><td class="mono">${naira(t.revenue)}</td></tr>`).join("") || `<tr class="empty-row"><td colspan="3">No sales recorded yet.</td></tr>`}
      </tbody></table></div>
    </div>`;
}

/* ---------- ACCOUNTING (admin only) ---------- */
function renderAccounting(){
  const allSums=sumSales(sales);
  const exp=totalExpenses();
  const netProfit=allSums.profit-exp;
  const grossMargin = allSums.revenue? allSums.profit/allSums.revenue*100:0;
  const netMargin = allSums.revenue? netProfit/allSums.revenue*100:0;
  return `
    <div class="kpi-grid">
      <div class="stat-card"><div class="stat-label">Total revenue</div><div class="stat-value" style="margin-top:8px">${naira(allSums.revenue)}</div></div>
      <div class="stat-card"><div class="stat-label">Cost of goods sold</div><div class="stat-value" style="margin-top:8px">${naira(allSums.cost)}</div></div>
      <div class="stat-card"><div class="stat-label">Gross profit</div><div class="stat-value" style="margin-top:8px;color:var(--green)">${naira(allSums.profit)}</div><div class="stat-sub">margin ${pct(grossMargin)}</div></div>
      <div class="stat-card"><div class="stat-label">Net profit</div><div class="stat-value" style="margin-top:8px;color:${netProfit>=0?'var(--green)':'var(--danger)'}">${naira(netProfit)}</div><div class="stat-sub">margin ${pct(netMargin)}</div></div>
    </div>
    <div class="two-col">
      <div class="panel">
        <div class="panel-head"><h3>Profit &amp; loss statement</h3><span style="font-size:11px;color:var(--muted)">all recorded sales</span></div>
        <div class="pl-block">
          <div class="pl-row"><span>Revenue</span><span class="mono">${naira(allSums.revenue)}</span></div>
          <div class="pl-row sub"><span class="label">Less: Cost of goods sold</span><span class="mono neg">(${naira(allSums.cost)})</span></div>
          <div class="pl-row total"><span>Gross profit</span><span class="mono">${naira(allSums.profit)} <span style="font-weight:400;color:var(--muted);font-size:11px">(${pct(grossMargin)})</span></span></div>
          <div class="pl-row sub" style="margin-top:8px"><span class="label">Less: Operating expenses</span><span class="mono neg">(${naira(exp)})</span></div>
          <div class="pl-row total"><span>Net profit</span><span class="mono" style="color:${netProfit>=0?'var(--green)':'var(--danger)'}">${naira(netProfit)} <span style="font-weight:400;color:var(--muted);font-size:11px">(${pct(netMargin)})</span></span></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Inventory valuation</h3></div>
        <div class="pl-block">
          <div class="pl-row"><span>Stock units on hand</span><span class="mono">${totalStockUnits()}</span></div>
          <div class="pl-row"><span>Value at cost</span><span class="mono">${naira(inventoryCostValue())}</span></div>
          <div class="pl-row"><span>Value at retail</span><span class="mono">${naira(inventoryRetailValue())}</span></div>
          <div class="pl-row total"><span>Unrealised potential profit</span><span class="mono" style="color:var(--green)">${naira(inventoryRetailValue()-inventoryCostValue())}</span></div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <h3>Operating expenses</h3>
        <button class="btn btn-primary btn-sm" onclick="openModal('addExpense')">${ICON.plus} Add expense</button>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th></th></tr></thead><tbody>
        ${expenses.length===0?`<tr class="empty-row"><td colspan="5">No expenses logged yet.</td></tr>`:
        expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<tr>
          <td class="mono">${fmtDate(e.date)}</td><td>${e.description}</td><td style="color:var(--muted)">${e.category}</td>
          <td class="mono">${naira(e.amount)}</td>
          <td><span class="icon-btn" title="Delete" onclick="deleteExpense('${e.id}')">${ICON.trash}</span></td>
        </tr>`).join("")}
        <tr><td colspan="3" style="text-align:right;color:var(--muted);font-weight:600">Total</td><td class="mono" style="font-weight:600">${naira(exp)}</td><td></td></tr>
      </tbody></table></div>
    </div>`;
}

/* ---------- USERS (admin only) ---------- */
function renderUsers(){
  return `
    <div class="panel">
      <div class="panel-head"><h3>Team</h3><button class="btn btn-ghost btn-sm" onclick="openModal('addUser')">${ICON.plus} Invite user</button></div>
      <div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr></thead><tbody>
        ${users.map(u=>`<tr>
          <td>${u.name}</td><td class="mono" style="color:var(--muted)">${u.email}</td>
          <td><span class="role-pill ${u.role.toLowerCase()}">${u.role}</span></td>
          <td><span class="icon-btn" title="Remove" onclick="deleteUser('${u.id}')">${ICON.trash}</span></td>
        </tr>`).join("")}
      </tbody></table></div>
    </div>`;
}

/* ---------- MODALS ---------- */
function renderModal(){
  const root=document.getElementById("modal-root");
  if(!S.modal){ root.innerHTML=""; return; }
  let html="";
  if(S.modal.type==="addProduct") html=productForm(null);
  else if(S.modal.type==="editProduct") html=productForm(products.find(p=>p.id===S.modal.id));
  else if(S.modal.type==="restock") html=restockForm(products.find(p=>p.id===S.modal.id));
  else if(S.modal.type==="addExpense") html=expenseForm();
  else if(S.modal.type==="addUser") html=userForm();
  root.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal">${html}</div></div>`;
}
function productForm(p){
  const editing=!!p;
  return `
    <div class="modal-head"><h3 class="display">${editing?'Edit product':'Add product'}</h3><span class="icon-btn" onclick="closeModal()">${ICON.x}</span></div>
    <div class="modal-body">
      <div class="field"><label>Product name</label><input id="f-name" value="${editing?p.name:''}" placeholder="e.g. Shea Glow Body Butter"/></div>
      <div class="field-row">
        <div class="field"><label>SKU</label><input id="f-sku" value="${editing?p.sku:''}" placeholder="e.g. BTY-005"/></div>
        <div class="field"><label>Category</label><select id="f-cat">${CATEGORIES.map(c=>`<option ${editing&&p.category===c?'selected':''}>${c}</option>`).join("")}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Cost price (₦)</label><input id="f-cost" type="number" min="0" value="${editing?p.cost:''}" oninput="updateMarginPreview()" placeholder="0"/></div>
        <div class="field"><label>Selling price (₦)</label><input id="f-price" type="number" min="0" value="${editing?p.price:''}" oninput="updateMarginPreview()" placeholder="0"/></div>
      </div>
      <div class="margin-preview" id="margin-preview">Profit per unit: <b>${editing?naira(p.price-p.cost):'₦0'}</b> &nbsp;·&nbsp; Margin: <b>${editing?pct((p.price-p.cost)/(p.price||1)*100):'0.0%'}</b></div>
      <div class="field-row">
        <div class="field"><label>Opening stock</label><input id="f-stock" type="number" min="0" value="${editing?p.stock:''}" placeholder="0"/></div>
        <div class="field"><label>Low stock alert at</label><input id="f-low" type="number" min="0" value="${editing?p.low:'5'}" placeholder="5"/></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="${editing?`saveEditProduct('${p.id}')`:'saveAddProduct()'}">${ICON.check} ${editing?'Save changes':'Add product'}</button>
    </div>`;
}
function restockForm(p){
  return `
    <div class="modal-head"><h3 class="display">Adjust stock</h3><span class="icon-btn" onclick="closeModal()">${ICON.x}</span></div>
    <div class="modal-body">
      <div class="field"><label>Product</label><input value="${p.name}" disabled style="color:var(--muted)"/></div>
      <div class="field"><label>Current stock</label><input value="${p.stock} units" disabled style="color:var(--muted)"/></div>
      <div class="field-row">
        <div class="field"><label>Type</label><select id="f-adj-type"><option value="add">Add stock (restock)</option><option value="remove">Remove stock (loss/damage)</option></select></div>
        <div class="field"><label>Quantity</label><input id="f-adj-qty" type="number" min="1" placeholder="0"/></div>
      </div>
      <div class="field"><label>Reason / note</label><input id="f-adj-reason" placeholder="e.g. New delivery from supplier"/></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveStockAdjustment('${p.id}')">${ICON.check} Save</button>
    </div>`;
}
function expenseForm(){
  return `
    <div class="modal-head"><h3 class="display">Add expense</h3><span class="icon-btn" onclick="closeModal()">${ICON.x}</span></div>
    <div class="modal-body">
      <div class="field"><label>Description</label><input id="f-exp-desc" placeholder="e.g. Generator fuel"/></div>
      <div class="field-row">
        <div class="field"><label>Category</label><select id="f-exp-cat">${["Rent","Utilities","Transport","Supplies","Wages","Marketing","Other"].map(c=>`<option>${c}</option>`).join("")}</select></div>
        <div class="field"><label>Amount (₦)</label><input id="f-exp-amt" type="number" min="0" placeholder="0"/></div>
      </div>
      <div class="field"><label>Date</label><input id="f-exp-date" type="date" value="${TODAY}"/></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveExpense()">${ICON.check} Add expense</button>
    </div>`;
}
function userForm(){
  return `
    <div class="modal-head"><h3 class="display">Invite user</h3><span class="icon-btn" onclick="closeModal()">${ICON.x}</span></div>
    <div class="modal-body">
      <div class="field"><label>Full name</label><input id="f-u-name" placeholder="e.g. Bisi Adeyemi"/></div>
      <div class="field"><label>Email</label><input id="f-u-email" placeholder="name@8fifteenwellness.com"/></div>
      <div class="field"><label>Role</label><select id="f-u-role"><option>Staff</option><option>Admin</option></select></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveUser()">${ICON.check} Send invite</button>
    </div>`;
}
function updateMarginPreview(){
  const cost=parseFloat(document.getElementById("f-cost").value)||0;
  const price=parseFloat(document.getElementById("f-price").value)||0;
  const margin = price? (price-cost)/price*100:0;
  document.getElementById("margin-preview").innerHTML = `Profit per unit: <b>${naira(price-cost)}</b> &nbsp;·&nbsp; Margin: <b>${pct(margin)}</b>`;
}

/* ---------- EVENT HANDLERS ---------- */
function setRole(r){ S.role=r; render(); }
function setView(v){ S.view=v; render(); }
function setInvSearch(v){ S.invSearch=v; renderContent(); }
function setInvCategory(c){ S.invCategory=c; renderContent(); }
function setHistSearch(v){ S.histSearch=v; renderContent(); }
function setHistFrom(v){ S.histFrom=v; renderContent(); }
function setHistTo(v){ S.histTo=v; renderContent(); }
function setHistCategory(c){ S.histCategory=c; renderContent(); }
function clearHistFilters(){ S.histFrom=""; S.histTo=""; S.histCategory="All"; S.histSearch=""; renderContent(); }
function setPayment(m){ S.payment=m; renderContent(); }

function openModal(type,id){ S.modal={type,id}; renderModal(); }
function closeModal(){ S.modal=null; renderModal(); }

function addToCart(id){
  const p=products.find(x=>x.id===id); if(!p) return;
  const have=S.cart[id]||0; if(have>=p.stock) return;
  S.cart[id]=have+1; renderContent();
}
function decFromCart(id){ if(!S.cart[id]) return; S.cart[id]-=1; if(S.cart[id]<=0) delete S.cart[id]; renderContent(); }
function removeFromCart(id){ delete S.cart[id]; renderContent(); }

function completeSale(){
  const lines=cartLines(); if(lines.length===0) return;
  const total=lines.reduce((s,l)=>s+l.product.price*l.qty,0);
  const cost=lines.reduce((s,l)=>s+l.product.cost*l.qty,0);
  const now=new Date();
  const time=now.toTimeString().slice(0,5);
  const receipt="8FW-"+(receiptCounter++);
  const items=lines.map(l=>({productId:l.product.id,name:l.product.name,category:l.product.category,qty:l.qty,price:l.product.price,cost:l.product.cost}));
  sales.push({id:uid("s"),receipt,date:TODAY,time,items,payment:S.payment,staff:S.role==="admin"?"Uthman Muhammad":"Staff",total,cost,profit:total-cost});
  products = products.map(p=>{ const l=lines.find(x=>x.product.id===p.id); return l? {...p,stock:p.stock-l.qty}:p; });
  S.cart={};
  showToast(`Sale ${receipt} completed — ${naira(total)}`);
}

function saveAddProduct(){
  const name=document.getElementById("f-name").value.trim();
  const sku=document.getElementById("f-sku").value.trim() || ("GEN-"+Math.floor(Math.random()*900+100));
  const category=document.getElementById("f-cat").value;
  const cost=parseFloat(document.getElementById("f-cost").value)||0;
  const price=parseFloat(document.getElementById("f-price").value)||0;
  const stock=parseInt(document.getElementById("f-stock").value)||0;
  const low=parseInt(document.getElementById("f-low").value)||5;
  if(!name){ alert("Product name is required."); return; }
  products.push({id:uid("p"),sku,name,category,cost,price,stock,low});
  closeModal(); renderContent(); showToast(`${name} added to inventory`);
}
function saveEditProduct(id){
  const idx=products.findIndex(p=>p.id===id); if(idx<0) return;
  const name=document.getElementById("f-name").value.trim();
  const sku=document.getElementById("f-sku").value.trim();
  const category=document.getElementById("f-cat").value;
  const cost=parseFloat(document.getElementById("f-cost").value)||0;
  const price=parseFloat(document.getElementById("f-price").value)||0;
  const stock=parseInt(document.getElementById("f-stock").value)||0;
  const low=parseInt(document.getElementById("f-low").value)||5;
  products[idx]={...products[idx],name,sku,category,cost,price,stock,low};
  closeModal(); renderContent(); showToast(`${name} updated`);
}
function deleteProduct(id){
  const p=products.find(x=>x.id===id); if(!p) return;
  if(!confirm(`Remove "${p.name}" from inventory?`)) return;
  products=products.filter(x=>x.id!==id); renderContent(); showToast(`${p.name} removed`);
}
function saveStockAdjustment(id){
  const p=products.find(x=>x.id===id); if(!p) return;
  const type=document.getElementById("f-adj-type").value;
  let qty=parseInt(document.getElementById("f-adj-qty").value)||0;
  const reason=document.getElementById("f-adj-reason").value.trim() || (type==="add"?"Restock":"Stock removed");
  if(qty<=0){ alert("Enter a quantity greater than zero."); return; }
  if(type==="remove") qty=-qty;
  if(p.stock+qty<0){ alert("Cannot remove more than current stock."); return; }
  p.stock += qty;
  stockAdjustments.push({name:p.name,qty,reason,time:new Date().toTimeString().slice(0,5)});
  closeModal(); renderContent(); showToast(`${p.name} stock updated to ${p.stock}`);
}
function saveExpense(){
  const description=document.getElementById("f-exp-desc").value.trim();
  const category=document.getElementById("f-exp-cat").value;
  const amount=parseFloat(document.getElementById("f-exp-amt").value)||0;
  const date=document.getElementById("f-exp-date").value || TODAY;
  if(!description||amount<=0){ alert("Enter a description and an amount greater than zero."); return; }
  expenses.push({id:"e"+(expenseCounter++),date,description,category,amount});
  closeModal(); renderContent(); showToast("Expense recorded");
}
function deleteExpense(id){ expenses=expenses.filter(e=>e.id!==id); renderContent(); }
function saveUser(){
  const name=document.getElementById("f-u-name").value.trim();
  const email=document.getElementById("f-u-email").value.trim();
  const role=document.getElementById("f-u-role").value;
  if(!name||!email){ alert("Enter a name and email."); return; }
  users.push({id:uid("u"),name,email,role});
  closeModal(); renderContent(); showToast(`Invite sent to ${name}`);
}
function deleteUser(id){
  const u=users.find(x=>x.id===id); if(!u) return;
  if(!confirm(`Remove ${u.name} from the team?`)) return;
  users=users.filter(x=>x.id!==id); renderContent();
}

/* ---------- INIT ---------- */
render();
</script>
</body>
</html>
