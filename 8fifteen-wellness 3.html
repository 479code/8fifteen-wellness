<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>8fifteen Wellness — Smart Inventory &amp; Sales</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Archivo:wght@600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  /* ---- Light theme (default) ---- */
  --ink:#1A1814;
  --bg:#F1EBDD;
  --surface:#F8F4EA;
  --paper:#FFFFFF;
  --line:#E2DAC6;
  --muted:#8A8170;

  --accent:#9C7A3C;
  --accent-ink:#FFFFFF;
  --accent-dark:#7E632F;
  --accent-bg:#F1E6CE;

  --success:#3E6B4A;
  --success-bg:#E3EAE1;
  --warn:#8A6A2E;
  --warn-bg:#F2E6C9;
  --danger:#9B4B3A;
  --danger-bg:#F3DFD8;

  --sidebar-bg:#131210;
  --sidebar-text:#EFE9DA;
  --sidebar-muted:#948C7A;
  --sidebar-line:rgba(239,233,218,.12);
  --sidebar-active-bg:#C9A766;
  --sidebar-active-text:#131210;

  --shadow:0 1px 2px rgba(20,18,12,.05), 0 6px 18px rgba(20,18,12,.05);
  --shadow-sm:0 1px 2px rgba(20,18,12,.06);
}
body.dark{
  --ink:#F1ECE0;
  --bg:#0E0D0B;
  --surface:#141310;
  --paper:#1B1916;
  --line:#332E22;
  --muted:#A39A86;

  --accent:#C9A766;
  --accent-ink:#15130F;
  --accent-dark:#DCC084;
  --accent-bg:#2B2415;

  --success:#7FAE8B;
  --success-bg:#1C2620;
  --warn:#D8B567;
  --warn-bg:#2E2615;
  --danger:#D08A78;
  --danger-bg:#2E1C18;

  --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.3);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
}

*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--ink);transition:background .2s ease,color .2s ease;}
.mono{font-family:'IBM Plex Mono',monospace;}
.display{font-family:'Bodoni Moda',serif;}
.wordmark{font-family:'Archivo',sans-serif;font-weight:900;}
button,input,select{font-family:inherit;}
button{transition:background .15s ease,border-color .15s ease,opacity .15s ease,transform .12s ease;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ---------- Motion system ---------- */
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes overlayFadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes modalPopIn{from{opacity:0;transform:scale(.95) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes toastSlideIn{from{opacity:0;transform:translateX(18px);}to{opacity:1;transform:translateX(0);}}
@keyframes pulseSoft{0%,100%{opacity:1;}50%{opacity:.5;}}
@keyframes lmDraw{to{stroke-dashoffset:0;}}
@keyframes lmSpin{to{transform:rotate(360deg);}}
@keyframes lmFadeIn{to{opacity:.45;}}
@keyframes lmPop{to{opacity:1;transform:scale(1);}}
@keyframes iconPop{from{opacity:0;transform:rotate(-90deg) scale(.5);}to{opacity:1;transform:rotate(0) scale(1);}}

.view-fade{animation:fadeInUp .35s ease both;}
.stat-card{animation:fadeInUp .4s ease both;}
.panel{animation:fadeInUp .4s ease both;}
.cat-card{animation:fadeInUp .4s ease both;}
.modal-overlay{animation:overlayFadeIn .18s ease both;}
.modal{animation:modalPopIn .22s cubic-bezier(.2,.9,.3,1.2) both;}
.toast{animation:toastSlideIn .25s ease both;}
.badge-out{animation:pulseSoft 1.8s ease-in-out infinite;}
.theme-btn svg{animation:iconPop .35s ease both;}
.sale-row{animation:fadeInUp .25s ease both;}
.nav-item svg{transition:transform .2s ease;}
.nav-item:hover svg{transform:translateX(2px);}
.chip,.icon-btn,.nav-item,.btn{transition:background .15s ease,border-color .15s ease,opacity .15s ease,transform .12s ease,color .15s ease;}
.btn:active,.chip:active,.icon-btn:active,.nav-item:active,.product-tile:active{transform:scale(.96);}
tbody tr{transition:background .15s ease;}
tbody tr:hover td{background:var(--bg);}

/* ---------- Brand logo motion ---------- */
.lm-draw{animation:lmDraw 1.6s ease forwards;}
.lm-draw-2{animation-delay:.25s;}
.lm-rotate{transform-box:view-box;transform-origin:60px 60px;animation:lmSpin 48s linear infinite;}
.lm-divider{opacity:0;animation:lmFadeIn .8s ease forwards;animation-delay:1.3s;}
.lm-center{opacity:0;transform-box:view-box;transform-origin:60px 60px;transform:scale(.85);animation:lmPop .6s cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:1.1s;}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
}

#app{display:flex;height:100vh;overflow:hidden;}

/* Sidebar — always the brand's "ink" panel, independent of theme */
.sidebar{width:236px;flex-shrink:0;background:var(--sidebar-bg);color:var(--sidebar-text);padding:26px 18px 18px;display:flex;flex-direction:column;}
.brand-mark{display:flex;justify-content:center;color:var(--sidebar-text);margin-bottom:14px;}
.brand-word{font-size:19px;letter-spacing:.16em;text-align:center;color:var(--sidebar-text);}
.brand-sub{font-family:'IBM Plex Sans',sans-serif;font-size:9.5px;letter-spacing:.22em;text-align:center;color:var(--sidebar-muted);margin:5px 0 26px;text-transform:uppercase;}
.nav{display:flex;flex-direction:column;gap:3px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:8px;font-size:13px;color:var(--sidebar-muted);cursor:pointer;background:transparent;border:none;text-align:left;width:100%;letter-spacing:.01em;}
.nav-item:hover{background:rgba(239,233,218,.07);color:var(--sidebar-text);}
.nav-item.active{background:var(--sidebar-active-bg);color:var(--sidebar-active-text);font-weight:700;}
.nav-item svg{flex-shrink:0;}
.sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--sidebar-line);font-size:10.5px;color:var(--sidebar-muted);line-height:1.7;}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface);position:relative;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--line);background:var(--surface);}
.topbar h1{font-size:22px;margin:0;font-weight:600;}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:7px;}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.role-toggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:12px;background:var(--paper);}
.role-toggle button{padding:7px 15px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-weight:600;}
.role-toggle button.active{background:var(--ink);color:var(--surface);}
.theme-btn{width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);}
.theme-btn:hover{border-color:var(--ink);}
.content{padding:24px 28px;overflow-y:auto;flex:1;}

/* Stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.stat-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow-sm);}
.stat-top{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.stat-icon{width:27px;height:27px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--paper);}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.stat-value{font-family:'Bodoni Moda',serif;font-size:24px;font-weight:600;}
.stat-sub{font-size:11.5px;color:var(--muted);margin-top:3px;}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
.panel-head{padding:14px 19px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.panel-head h3{margin:0;font-size:13.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}

table{width:100%;border-collapse:collapse;font-size:12.8px;}
th{text-align:left;font-size:10.3px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 16px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600;}
td{padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.empty-row td{text-align:center;color:var(--muted);padding:24px;white-space:normal;}
.table-wrap{overflow-x:auto;}

.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;letter-spacing:.02em;}
.badge-ok{background:var(--success-bg);color:var(--success);}
.badge-low{background:var(--warn-bg);color:var(--warn);}
.badge-out{background:var(--danger-bg);color:var(--danger);}
.badge-pay{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:600;}

.toolbar{display:flex;gap:10px;margin-bottom:15px;align-items:center;flex-wrap:wrap;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 12px;flex:1;min-width:160px;max-width:300px;}
.search-box input{border:none;outline:none;font-size:13px;flex:1;background:transparent;color:var(--ink);}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:12.3px;cursor:pointer;color:var(--muted);font-weight:500;}
.chip.active{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600;}
.date-input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;background:var(--paper);color:var(--ink);}

.btn{font-size:12.8px;font-weight:700;padding:9px 16px;border-radius:8px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;letter-spacing:.01em;}
.btn-primary{background:var(--accent);color:var(--accent-ink);}
.btn-primary:hover{background:var(--accent-dark);}
.btn-primary:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn-ghost:hover{border-color:var(--ink);}
.btn-danger{background:transparent;border:1px solid var(--danger-bg);color:var(--danger);}
.btn-sm{padding:6px 11px;font-size:11.5px;border-radius:6px;}
.icon-btn{width:27px;height:27px;border-radius:6px;border:1px solid var(--line);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);}
.icon-btn:hover{border-color:var(--ink);}

/* Sales entry */
.sale-meta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;padding:16px 19px;border-bottom:1px solid var(--line);}
.sale-meta .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px;font-weight:600;}
.pay-row{display:flex;gap:6px;}
.row-select{width:100%;min-width:230px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);font-size:12.6px;}
.row-qty{width:64px;padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);font-size:12.6px;text-align:center;}
.row-select:disabled,.row-qty:disabled{opacity:.5;}
.sale-summary{display:flex;justify-content:flex-end;padding:14px 19px 0;}
.sale-summary-box{min-width:260px;}
.sale-foot{display:flex;align-items:center;justify-content:space-between;padding:17px 19px;flex-wrap:wrap;gap:10px;}

/* KPI / Accounting */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
.pl-block{padding:19px;}
.pl-row{display:flex;justify-content:space-between;padding:9px 0;font-size:13.3px;border-bottom:1px dashed var(--line);}
.pl-row.total{border-bottom:none;border-top:2px solid var(--ink);margin-top:5px;padding-top:13px;font-weight:700;}
.pl-row .neg{color:var(--danger);}
.pl-row.sub .label{color:var(--muted);padding-left:14px;}

.bar-row{display:flex;align-items:center;gap:10px;padding:9px 0;}
.bar-row .bname{font-size:12.3px;width:120px;flex-shrink:0;}
.bar-track{flex:1;height:9px;background:var(--bg);border-radius:999px;overflow:hidden;}
.bar-fill{height:100%;border-radius:999px;}
.bar-val{font-size:11.5px;width:90px;text-align:right;flex-shrink:0;color:var(--muted);}

.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
.cat-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow-sm);}
.cat-card h4{margin:0 0 11px;font-size:13.8px;display:flex;align-items:center;justify-content:space-between;font-weight:700;}
.cat-card .row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:var(--muted);}
.cat-card .row b{color:var(--ink);font-weight:600;}
.cat-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px;}

.role-pill{font-size:10px;font-weight:700;padding:2px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;}
.role-pill.admin{background:var(--success-bg);color:var(--success);}
.role-pill.staff{background:var(--warn-bg);color:var(--warn);}

.toast{position:absolute;bottom:22px;right:22px;background:var(--sidebar-bg);color:var(--sidebar-text);padding:12px 19px;border-radius:9px;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:50;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,14,11,.5);display:flex;align-items:center;justify-content:center;z-index:100;}
.modal{background:var(--paper);border-radius:14px;width:430px;max-width:92vw;max-height:88vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);}
.modal-head{padding:17px 21px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{margin:0;font-size:16.5px;font-weight:600;}
.modal-body{padding:19px 21px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.3px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;font-weight:600;}
.field input,.field select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.3px;background:var(--surface);color:var(--ink);}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-foot{padding:15px 21px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
.margin-preview{background:var(--accent-bg);border-radius:8px;padding:11px 13px;font-size:12px;color:var(--muted);margin-top:-3px;margin-bottom:14px;display:flex;justify-content:space-between;}
.margin-preview b{color:var(--accent-dark);font-family:'IBM Plex Mono',monospace;}
body.dark .margin-preview b{color:var(--accent);}

.access-note{padding:64px 20px;text-align:center;color:var(--muted);font-size:13.5px;}

@media (max-width: 880px){
  .sidebar{display:none;}
  .stat-grid,.kpi-grid,.cat-grid{grid-template-columns:repeat(2,1fr);}
  .two-col,.pos-grid,.product-grid,.field-row{grid-template-columns:1fr;}
}
</style>
</head>

<div id="app"></div>
<div id="modal-root"></div>

   the page resets data. No backend, no network calls.

function mkSale(receipt,date,time,items,payment,staff){
  const lines = items.map(it=>{
    const p = products.find(x=>x.id===it.id);
    return {productId:p.id,name:p.name,category:p.category,qty:it.qty,price:p.price,cost:p.cost};
  });
  const total = lines.reduce((s,l)=>s+l.price*l.qty,0);
  const costTotal = lines.reduce((s,l)=>s+l.cost*l.qty,0);
  return {id:"s_"+receipt,receipt,date,time,items:lines,payment,staff,total,cost:costTotal,profit:total-costTotal};
}

function naira(n){ return "₦"+Math.round(n||0).toLocaleString("en-NG"); }

/* ---------- AGGREGATES ---------- */
function lowStockItems(){ return products.filter(p=>p.stock<=p.low); }
function totalStockUnits(){ return products.reduce((s,p)=>s+p.stock,0); }
function inventoryCostValue(){ return products.reduce((s,p)=>s+p.stock*p.cost,0); }
function inventoryRetailValue(){ return products.reduce((s,p)=>s+p.stock*p.price,0); }
function salesOn(date){ return sales.filter(s=>s.date===date); }
function sumSales(list){
  return list.reduce((acc,s)=>({revenue:acc.revenue+s.total,cost:acc.cost+s.cost,profit:acc.profit+s.profit,items:acc.items+s.items.reduce((a,l)=>a+l.qty,0)}),{revenue:0,cost:0,profit:0,items:0});
}
function totalExpenses(list){ return (list||expenses).reduce((s,e)=>s+e.amount,0); }
function categoryStats(){
  return CATEGORIES.map(cat=>{
    const prods = products.filter(p=>p.category===cat);
    const stockUnits = prods.reduce((s,p)=>s+p.stock,0);
    const stockCost = prods.reduce((s,p)=>s+p.stock*p.cost,0);
    const stockRetail = prods.reduce((s,p)=>s+p.stock*p.price,0);
    let unitsSold=0, revenue=0, cost=0;
    sales.forEach(s=>s.items.forEach(l=>{ if(l.category===cat){ unitsSold+=l.qty; revenue+=l.price*l.qty; cost+=l.cost*l.qty; } }));
    return {cat,productCount:prods.length,stockUnits,stockCost,stockRetail,unitsSold,revenue,cost,profit:revenue-cost,margin: revenue? (revenue-cost)/revenue*100:0};
  });
}
function topProducts(limit){
  const map={};
  sales.forEach(s=>s.items.forEach(l=>{
    if(!map[l.productId]) map[l.productId]={name:l.name,qty:0,revenue:0};
    map[l.productId].qty+=l.qty; map[l.productId].revenue+=l.price*l.qty;
  }));
  return Object.values(map).sort((a,b)=>b.revenue-a.revenue).slice(0,limit||5);
}
function filteredHistory(){
  return sales.filter(s=>{
    if(S.histFrom && s.date<S.histFrom) return false;
    if(S.histTo && s.date>S.histTo) return false;
    if(S.histCategory!=="All" && !s.items.some(l=>l.category===S.histCategory)) return false;
    if(S.histSearch && !s.receipt.toLowerCase().includes(S.histSearch.toLowerCase())) return false;
    return true;
  }).sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));
}

  const rowsHtml = rows.map(r=>{
    const product = products.find(p=>p.id===r.productId);
    const unitPrice = product? product.price:0;
    const qty = product? (r.qty||1):0;
    const lineTotal = unitPrice*qty;
    if(product){ subtotal+=lineTotal; totalQty+=qty; }
    return `<tr class="sale-row">
      <td style="min-width:240px">
        <select class="row-select" onchange="setRowProduct('${r.rowId}', this.value)">
          <option value="">Select a product…</option>
          ${products.map(p=>`<option value="${p.id}" ${r.productId===p.id?'selected':''} ${p.stock===0?'disabled':''}>${p.name} — ${naira(p.price)}${p.stock===0?' (out of stock)':` (${p.stock} in stock)`}</option>`).join("")}
        </select>
      </td>
      <td><input class="row-qty mono" type="number" min="1" max="${product?product.stock:999}" value="${r.qty}" ${!product?'disabled':''} oninput="setRowQty('${r.rowId}', this.value)"/></td>
      <td class="mono">${product? naira(unitPrice):'—'}</td>
      <td class="mono">${product? naira(lineTotal):'—'}</td>
      <td><span class="icon-btn" title="Remove line" onclick="removeSaleRow('${r.rowId}')">${ICON.x}</span></td>
    </tr>`;
  }).join("");
  return `
    <div class="panel">
      <div class="sale-meta">
        <div>
          <div class="label">Payment method</div>
          <div class="pay-row">
            ${["Cash","Card","Transfer"].map(m=>`<button class="chip ${S.payment===m?'active':''}" onclick="setPayment('${m}')">${m}</button>`).join("")}
          </div>
        </div>
        <div style="text-align:right">
          <div class="label">Logged by</div>
          <div style="font-size:13px;font-weight:600">${S.role==="admin"?"Uthman Muhammad":"Staff"} · ${TODAY}</div>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Product</th><th>Qty</th><th>Unit price</th><th>Line total</th><th></th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
      <div style="padding:10px 19px 0">
        <button class="btn btn-ghost btn-sm" onclick="addSaleRow()">${ICON.plus} Add item</button>
      </div>
      <div class="sale-summary">
        <div class="sale-summary-box">
          <div class="pl-row"><span>Items</span><span class="mono">${totalQty}</span></div>
          <div class="pl-row total"><span>Total due</span><span class="mono display" style="font-size:21px">${naira(subtotal)}</span></div>
        </div>
      </div>
      <div class="sale-foot">
        <span style="font-size:11.5px;color:var(--muted)">Stock updates automatically once the sale is recorded.</span>
        <button class="btn btn-primary" ${saleRowsValid().length===0?'disabled':''} onclick="completeSale()">${ICON.check} Record sale</button>
      </div>
    </div>`;
}

function renderModal(){
  const root=document.getElementById("modal-root");
  if(!S.modal){ root.innerHTML=""; return; }
  let html="";
  if(S.modal.type==="addProduct") html=productForm(null);
  else if(S.modal.type==="editProduct") html=productForm(products.find(p=>p.id===S.modal.id));
  else if(S.modal.type==="restock") html=restockForm(products.find(p=>p.id===S.modal.id));

/* ---------- EVENT HANDLERS ---------- */
function setRole(r){ S.role=r; render(); }
function setView(v){ S.view=v; render(); }
function setInvSearch(v){ S.invSearch=v; renderContent(); }
function setInvCategory(c){ S.invCategory=c; renderContent(); }
function setHistSearch(v){ S.histSearch=v; renderContent(); }
function setHistFrom(v){ S.histFrom=v; renderContent(); }
function setHistTo(v){ S.histTo=v; renderContent(); }
function setHistCategory(c){ S.histCategory=c; renderContent(); }
function clearHistFilters(){ S.histFrom=""; S.histTo=""; S.histCategory="All"; S.histSearch=""; renderContent(); }
function setPayment(m){ S.payment=m; renderContent(); }

function openModal(type,id){ S.modal={type,id}; renderModal(); }
function closeModal(){ S.modal=null; renderModal(); }

function addSaleRow(){ S.saleRows.push({rowId:uid("row"),productId:"",qty:1}); renderContent(); }
function removeSaleRow(rowId){
  S.saleRows = S.saleRows.filter(r=>r.rowId!==rowId);
  if(S.saleRows.length===0) S.saleRows.push({rowId:uid("row"),productId:"",qty:1});
  renderContent();
}
function setRowProduct(rowId,productId){
  const row=S.saleRows.find(r=>r.rowId===rowId); if(!row) return;
  row.productId=productId; if(!row.qty) row.qty=1;
  renderContent();
}
function setRowQty(rowId,val){
  const row=S.saleRows.find(r=>r.rowId===rowId); if(!row) return;
  row.qty=Math.max(1,parseInt(val)||1);
  renderContent();
}

function completeSale(){
  const valid=saleRowsValid();
  if(valid.length===0){ alert("Add at least one product to the sale."); return; }
  const agg={};
  valid.forEach(r=>{ agg[r.productId]=(agg[r.productId]||0)+(r.qty||1); });
  for(const pid in agg){
    const p=products.find(x=>x.id===pid);
    if(!p || agg[pid]>p.stock){ alert(`${p?p.name:"That product"} only has ${p?p.stock:0} unit(s) in stock.`); return; }
  }
  const items=Object.entries(agg).map(([pid,qty])=>{
    const p=products.find(x=>x.id===pid);
    return {productId:p.id,name:p.name,category:p.category,qty,price:p.price,cost:p.cost};
  });
  const total=items.reduce((s,l)=>s+l.price*l.qty,0);
  const cost=items.reduce((s,l)=>s+l.cost*l.qty,0);
  const time=new Date().toTimeString().slice(0,5);
  const receipt="8FW-"+(receiptCounter++);
  sales.push({id:uid("s"),receipt,date:TODAY,time,items,payment:S.payment,staff:S.role==="admin"?"Uthman Muhammad":"Staff",total,cost,profit:total-cost});
  products = products.map(p=>{ const qty=agg[p.id]; return qty? {...p,stock:p.stock-qty}:p; });
  S.saleRows=[{rowId:uid("row"),productId:"",qty:1}];
  showToast(`Sale ${receipt} recorded — ${naira(total)}`);
}

function saveAddProduct(){
  const name=document.getElementById("f-name").value.trim();
  const sku=document.getElementById("f-sku").value.trim() || ("GEN-"+Math.floor(Math.random()*900+100));
  const category=document.getElementById("f-cat").value;
  const cost=parseFloat(document.getElementById("f-cost").value)||0;
  const price=parseFloat(document.getElementById("f-price").value)||0;
  const stock=parseInt(document.getElementById("f-stock").value)||0;
  const low=parseInt(document.getElementById("f-low").value)||5;
  if(!name){ alert("Product name is required."); return; }
  products.push({id:uid("p"),sku,name,category,cost,price,stock,low});
  closeModal(); renderContent(); showToast(`${name} added to inventory`);
}
function saveEditProduct(id){
  const idx=products.findIndex(p=>p.id===id); if(idx<0) return;
  const name=document.getElementById("f-name").value.trim();
  const sku=document.getElementById("f-sku").value.trim();
  const category=document.getElementById("f-cat").value;
  const cost=parseFloat(document.getElementById("f-cost").value)||0;
  const price=parseFloat(document.getElementById("f-price").value)||0;
  const stock=parseInt(document.getElementById("f-stock").value)||0;
  const low=parseInt(document.getElementById("f-low").value)||5;
  products[idx]={...products[idx],name,sku,category,cost,price,stock,low};
  closeModal(); renderContent(); showToast(`${name} updated`);
}
function deleteProduct(id){
  const p=products.find(x=>x.id===id); if(!p) return;
  if(!confirm(`Remove "${p.name}" from inventory?`)) return;
  products=products.filter(x=>x.id!==id); renderContent(); showToast(`${p.name} removed`);
}
function saveStockAdjustment(id){
  const p=products.find(x=>x.id===id); if(!p) return;
  const type=document.getElementById("f-adj-type").value;
  let qty=parseInt(document.getElementById("f-adj-qty").value)||0;
  const reason=document.getElementById("f-adj-reason").value.trim() || (type==="add"?"Restock":"Stock removed");
  if(qty<=0){ alert("Enter a quantity greater than zero."); return; }
  if(type==="remove") qty=-qty;
  if(p.stock+qty<0){ alert("Cannot remove more than current stock."); return; }
  p.stock += qty;
  stockAdjustments.push({name:p.name,qty,reason,time:new Date().toTimeString().slice(0,5)});
  closeModal(); renderContent(); showToast(`${p.name} stock updated to ${p.stock}`);
}
function saveExpense(){
  const description=document.getElementById("f-exp-desc").value.trim();
  const category=document.getElementById("f-exp-cat").value;
  const amount=parseFloat(document.getElementById("f-exp-amt").value)||0;
  const date=document.getElementById("f-exp-date").value || TODAY;
  if(!description||amount<=0){ alert("Enter a description and an amount greater than zero."); return; }
  expenses.push({id:"e"+(expenseCounter++),date,description,category,amount});
  closeModal(); renderContent(); showToast("Expense recorded");
}
function deleteExpense(id){ expenses=expenses.filter(e=>e.id!==id); renderContent(); }
function saveUser(){
  const name=document.getElementById("f-u-name").value.trim();
  const email=document.getElementById("f-u-email").value.trim();
  const role=document.getElementById("f-u-role").value;
  if(!name||!email){ alert("Enter a name and email."); return; }
  users.push({id:uid("u"),name,email,role});
  closeModal(); renderContent(); showToast(`Invite sent to ${name}`);
}
function deleteUser(id){
  const u=users.find(x=>x.id===id); if(!u) return;
  if(!confirm(`Remove ${u.name} from the team?`)) return;
  users=users.filter(x=>x.id!==id); renderContent();
}

/* ---------- INIT ---------- */
applyTheme();
render();
</script>
</body>
